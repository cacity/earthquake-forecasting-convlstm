name: Research audit interest
description: Public, no-email scope check for fixed-price reproducibility and pre-submission QA.
title: "[Research audit interest] "
body:
  - type: markdown
    attributes:
      value: |
        This public form is for an initial, non-sensitive scope check with **stark fng**.

        Published options are USD 399 for a pre-submission red-flag audit, USD 1,499 for a reproducibility sprint, and USD 2,999 for full submission-package QA. Opening an Issue is not an order, reservation, invoice, payment obligation, or promise of acceptance or publication.

        Do not post or link a manuscript, unpublished results, restricted data, patient or participant information, credentials, private repositories, customer data, personal data, or confidential institutional material. No files or payment instructions are exchanged through this public Issue, and requests are not handled by email.

  - type: dropdown
    id: service
    attributes:
      label: Service of interest
      options:
        - USD 399 pre-submission red-flag audit
        - USD 1,499 reproducibility sprint
        - USD 2,999 full submission-package QA
        - Unsure; need a scope recommendation
    validations:
      required: true

  - type: input
    id: research-field
    attributes:
      label: Research field
      description: Use a broad field only; do not identify a person, institution, project, or unpublished study.
      placeholder: "Example: seismology, machine learning, ecology"
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Current stage
      options:
        - Draft analysis or manuscript
        - Pre-submission QA
        - Revision or transfer
        - Reproducibility check without a manuscript
    validations:
      required: true

  - type: checkboxes
    id: readiness
    attributes:
      label: Materials available after a scope and secure-transfer method are agreed
      description: Select every general category that exists. Do not upload or link any file here.
      options:
        - label: Runnable scripts or notebooks
        - label: De-identified or shareable derived results
        - label: Figures or tables with generation records
        - label: Environment or dependency instructions
        - label: Manuscript or report draft
    validations:
      required: true

  - type: textarea
    id: concerns
    attributes:
      label: Non-sensitive audit goals
      description: Describe categories of concern only. Do not paste text, data, results, reviewer comments, or confidential details.
      placeholder: "Example: numerical consistency, figure-to-code traceability, and environment reproducibility"
    validations:
      required: true

  - type: dropdown
    id: target-window
    attributes:
      label: Preferred completion window
      options:
        - Within 2 weeks
        - Within 1 month
        - More than 1 month
        - No fixed date
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Public-form confirmation
      options:
        - label: I understand this public Issue is a scope check, not an order, invoice, payment request, or publication guarantee.
          required: true
        - label: I have not included confidential, restricted, unpublished, identifying, or personal information.
          required: true
